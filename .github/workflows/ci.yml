name: ci
on:
  pull_request:
  push:
    branches: [develop]
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make check-go
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build --build-arg VERSION=ci -t recall:ci .
      - run: docker save recall:ci -o image.tar
      - uses: actions/upload-artifact@v6
        with:
          name: image
          path: image.tar
          retention-days: 1
  integration:
    # Replays the captured webhooks through the image the build job made.
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v6
        with:
          name: image
      - run: docker load -i image.tar
      - run: RECALL_IMAGE=recall:ci go test -count=1 -tags integration ./test/
